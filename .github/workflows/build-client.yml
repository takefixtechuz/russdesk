name: Build custom client

# Builds a RustDesk client from client/vendor with your self-hosted ID server,
# relay server, public key — and, with a password, unattended access — baked in,
# so the resulting .exe / .apk connects to your server with no manual setup and
# the console can connect without the remote user accepting. Toolchain versions
# mirror RustDesk 1.5.0's own CI (client/vendor/.github/workflows/flutter-build.yml).
#
# Configure once (Actions tab, Run workflow), or set repo-level defaults:
#   - Variable RENDEZVOUS_SERVER  e.g. rd.example.com:21116   (or the id_server input)
#   - Secret   RS_PUB_KEY         hbbs' id_ed25519.pub        (or the key input)
#   - Variable RELAY_SERVER / API_SERVER                       optional
#   - Secret   UNATTENDED_PASSWORD  shared permanent password  (or the password input)
# Inputs win over repo vars/secrets. Only the password's hash is baked into the
# binary, so publishing the client (even publicly) does not expose the password.

on:
  workflow_dispatch:
    inputs:
      id_server:
        description: "ID/rendezvous server host:port (overrides RENDEZVOUS_SERVER)"
        required: false
      key:
        description: "hbbs public key (overrides the RS_PUB_KEY secret)"
        required: false
      relay_server:
        description: "Relay server host:port (overrides RELAY_SERVER)"
        required: false
      api_server:
        description: "API server URL (overrides API_SERVER)"
        required: false
      password:
        description: "Shared unattended permanent password (overrides UNATTENDED_PASSWORD). Empty = no unattended access."
        required: false
      targets:
        description: "What to build"
        type: choice
        default: "android+windows"
        options: ["android+windows", "android", "windows"]

permissions:
  contents: write  # create/update the GitHub Release for the Windows client

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # Resolved config, inputs winning over repo vars. (secrets can't be used in a
  # workflow-level env, so RS_PUB_KEY / UNATTENDED_PASSWORD are set per bake step.)
  ID_SERVER: ${{ github.event.inputs.id_server || vars.RENDEZVOUS_SERVER }}
  RELAY_SERVER: ${{ github.event.inputs.relay_server || vars.RELAY_SERVER }}
  API_SERVER: ${{ github.event.inputs.api_server || vars.API_SERVER }}

jobs:
  # Мост Rust↔Flutter (bridge_generated.rs / generated_bridge.dart) RustDesk генерирует отдельной
  # job'ой (.github/workflows/bridge.yml) и подкладывает в сборки; без него cargo падает с
  # «file not found for module bridge_generated». Повторяем здесь (26.10.2026).
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        working-directory: client/vendor
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          ( cd flutter && flutter pub get )

      - name: Run flutter rust bridge
        working-directory: client/vendor
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            client/vendor/src/bridge_generated.rs
            client/vendor/src/bridge_generated.io.rs
            client/vendor/flutter/lib/generated_bridge.dart
            client/vendor/flutter/lib/generated_bridge.freezed.dart
            client/vendor/flutter/macos/Runner/bridge_generated.h
            client/vendor/flutter/ios/Runner/bridge_generated.h

  android:
    if: contains(github.event.inputs.targets || 'android+windows', 'android')
    needs: bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: client/vendor

      # как в официальном flutter-build.yml RustDesk: системные пакеты для vcpkg/ffmpeg и NDK-сборки
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libclang-dev libunwind-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Bake server config into the client
        env:
          RS_PUB_KEY: ${{ github.event.inputs.key || secrets.RS_PUB_KEY }}
          UNATTENDED_PASSWORD: ${{ github.event.inputs.password || secrets.UNATTENDED_PASSWORD }}
        run: |
          test -n "$ID_SERVER" || { echo "::error::set the RENDEZVOUS_SERVER repo variable or id_server input"; exit 1; }
          test -n "$RS_PUB_KEY" || { echo "::error::set the RS_PUB_KEY repo secret or key input"; exit 1; }
          python3 client/configure_client.py \
            --id-server "$ID_SERVER" --key "$RS_PUB_KEY" \
            --relay "$RELAY_SERVER" --api-server "$API_SERVER" \
            --password "$UNATTENDED_PASSWORD"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Patch flutter (dropdown enableFilter, как в RustDesk CI для 3.24.5)
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/client/vendor/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: "aarch64-linux-android,armv7-linux-androideabi"

      # без этого build_android_deps.sh падает: «Please set VCPKG_ROOT environment variable»
      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Build Rust jniLibs + APK
        working-directory: client/vendor
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
        run: |
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/build_android_deps.sh arm64-v8a armeabi-v7a
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/ || true
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/ || true
          ( cd flutter && flutter pub get && bash build_android.sh )

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-android-custom
          path: client/vendor/flutter/build/app/outputs/flutter-apk/app-*-release.apk

  windows:
    if: contains(github.event.inputs.targets || 'android+windows', 'windows')
    needs: bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: client/vendor

      # bindgen/cc нужен LLVM, как в официальной сборке RustDesk для Windows
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"

      - name: Bake server config into the client
        shell: bash
        env:
          RS_PUB_KEY: ${{ github.event.inputs.key || secrets.RS_PUB_KEY }}
          UNATTENDED_PASSWORD: ${{ github.event.inputs.password || secrets.UNATTENDED_PASSWORD }}
        run: |
          test -n "$ID_SERVER" || { echo "::error::set the RENDEZVOUS_SERVER repo variable or id_server input"; exit 1; }
          test -n "$RS_PUB_KEY" || { echo "::error::set the RS_PUB_KEY repo secret or key input"; exit 1; }
          python3 client/configure_client.py \
            --id-server "$ID_SERVER" --key "$RS_PUB_KEY" \
            --relay "$RELAY_SERVER" --api-server "$API_SERVER" \
            --password "$UNATTENDED_PASSWORD"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: "x86_64-pc-windows-msvc"

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "C:/vcpkg"
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows-static libvpx libyuv opus aom

      - name: Build Windows client
        working-directory: client/vendor
        shell: bash
        env:
          VCPKG_ROOT: "C:/vcpkg"
        run: |
          ( cd flutter && flutter pub get )
          python build.py --portable --flutter --skip-portable-pack

      - name: Package single-file portable exe
        working-directory: client/vendor
        shell: bash
        run: |
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p dist
          host=$(printf '%s' "$ID_SERVER" | sed 's#^[a-z]*://##; s#[:/].*##')
          mv ./target/release/rustdesk-portable-packer.exe "./dist/russdesk-${host}-windows-x64.exe"
          ( cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-custom
          path: client/vendor/dist/*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-client
          name: Windows client (custom)
          body: |
            Preconfigured RussDesk Windows client (portable, single exe).
            Connects to the baked-in ID server automatically; unattended access
            is enabled when the build set a shared password. Built from
            ${{ github.sha }}.
          files: |
            client/vendor/dist/russdesk-*-windows-x64.exe
            client/vendor/dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
